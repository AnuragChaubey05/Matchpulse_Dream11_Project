function applyLang(){
  var t = T[state.lang];
  document.documentElement.lang = state.lang==="hi" ? "hi-Latn" : "en";
  var els = document.querySelectorAll("[data-t]");
  for(var i=0;i<els.length;i++){
    var k = els[i].getAttribute("data-t");
    if(t[k]!==undefined){
      if(k==="nzName" || k==="indName"){ els[i].innerHTML = t[k]; } else { els[i].textContent = t[k]; }
    }
  }
  var ps = document.querySelectorAll("[data-tp]");
  for(var j=0;j<ps.length;j++){ var pk = ps[j].getAttribute("data-tp"); if(t[pk]!==undefined) ps[j].setAttribute("placeholder", t[pk]); }
  var seg = document.querySelectorAll(".seg button");
  for(var s=0;s<seg.length;s++){ seg[s].setAttribute("aria-pressed", seg[s].getAttribute("data-lang")===state.lang ? "true" : "false"); }
  buildCaptainSelect();
  buildFeed();
  buildChips();
  renderPanel();
  aiReady();
}

function buildCaptainSelect(){
  var sel = $("capSel");

    sel.appendChild(o);

}

function cleanFantasy(t){ return String(t||"").replace(/^\s*FANTASY:\s*/i,"").trim(); }
function parseAnswer(t){
  t = String(t||"");
  var i = t.search(/FANTASY:/i), ex = i>=0 ? t.slice(0,i) : t, fa = i>=0 ? t.slice(i).replace(/^FANTASY:\s*/i,"") : "";
  ex = ex.replace(/^\s*EXPLAIN:\s*/i,"").trim();
  fa = fa.trim();
  if(fa==="-"||fa==="–"||fa==="—") fa = "";
  return { ex:ex, fa:fa };
}
async function serverAI(prompt, opts){
  opts = opts || {};
  var r;
  try{
    r = await fetch("/api/explain", { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ prompt:prompt }), signal:opts.signal });
  }catch(e){
    if(e && e.name==="AbortError") throw { code:"cancelled" };
    throw { code:"upstream_error" };
  }
  if(!r.ok){
    throw { code: r.status===429 ? "rate_limited" : r.status===422 ? "refused" : (r.status===404||r.status===503) ? "not_declared" : "upstream_error" };
  }
  var d;
  try{ d = await r.json(); }catch(e){ throw { code:"upstream_error" }; }
  if(!d || !d.text) throw { code:"empty_completion" };
  if(opts.onText) opts.onText({ text:d.text, delta:d.text });
  return { text:d.text, truncated:!!d.truncated };
}
function failCopy(e){

  if(c==="cancelled") return { msg:t.stopped, hide:false };
  if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared"||c==="capability_disabled"||c==="capability_removed"||c==="tools_unavailable") return { msg:t.unavail, hide:true };
  if(c==="rate_limited") return { msg:t.rate, hide:false };
  if(c==="refused") return { msg:t.refused, hide:false };
  if(c==="session_expired") return { msg:t.signin, hide:false };
  return { msg:t.error, hide:false };
}

function resetAI(){
  if(liveCtl){ var a = liveCtl; liveCtl = null; a.abort(); }
  if(askCtl){ var b = askCtl; askCtl = null; b.abort(); }
  $("liveOut").hidden = true; $("liveStop").hidden = true; $("liveBtn").disabled = false;
  $("answer").hidden = true; $("askStop").hidden = true; $("askBtn").disabled = false;
}

async function runLive(){
  if(!sample) return;
  var t = T[state.lang];
  if(liveCtl){ var old = liveCtl; liveCtl = null; old.abort(); }
  var ctrl = new AbortController(); liveCtl = ctrl;
  var out = $("liveText"), note = $("liveNote");
  $("liveOut").hidden = false; out.textContent = t.thinking; note.textContent = "";
  $("liveStop").hidden = false; $("liveBtn").disabled = true;
  try{
    var res = await sample(livePrompt(curMoment(), curPlayer()), {
      modelTier:"quick",
      signal:ctrl.signal,
      onText:function(u){ if(liveCtl===ctrl) out.textContent = cleanFantasy(u.text); }
    });
    if(liveCtl===ctrl){
      out.textContent = cleanFantasy(res.text);
      note.textContent = res.truncated ? t.cut : "";
    }
  }catch(e){
    if(liveCtl!==ctrl) return;
    var f = failCopy(e);
    if(f.hide){ sample = null; aiReady(); }
    if(e && e.text){ out.textContent = cleanFantasy(e.text); note.textContent = f.msg; }
    else { out.textContent = f.msg; note.textContent = ""; }
  }finally{
    if(liveCtl===ctrl){ liveCtl = null; $("liveStop").hidden = true; $("liveBtn").disabled = false; }
  }
}

function paintAnswer(a){
  $("ansEx").textContent = a.ex || T[state.lang].thinking;
  if(a.fa){ $("ansFa").hidden = false; $("ansFaText").textContent = a.fa; }
  else { $("ansFa").hidden = true; }
}

function renderFallback(q){
  var t = T[state.lang], s = q.toLowerCase(), ex = "", fa = "", hit = null;
  for(var i=0;i<ROUTES.length;i++){ if(ROUTES[i].re.test(s)){ hit = ROUTES[i]; break; } }
  if(hit){ var m = momentById(hit.id); ex = m.plain[state.lang]; fa = m.fantasy[state.lang]; }
  else if(/captain|vice/.test(s)){ ex = curPlayer().line[state.lang]; }
  else { ex = t.noMatch; }
  paintAnswer({ ex:ex, fa:fa });
  $("ansNote").textContent = t.preparedBadge;
}

async function ask(q){
  q = String(q||"").trim().slice(0,240);
  if(!q) return;
  var t = T[state.lang];
  if(askCtl){ var old = askCtl; askCtl = null; old.abort(); }
  $("answer").hidden = false;
  $("ansQ").textContent = t.youAsked+" "+q;
  $("ansEx").textContent = ""; $("ansFa").hidden = true; $("ansNote").textContent = ""; $("askStop").hidden = true;
  if(!sample){ renderFallback(q); return; }
  var ctrl = new AbortController(); askCtl = ctrl;
  $("ansEx").textContent = t.thinking; $("askStop").hidden = false; $("askBtn").disabled = true;
  try{
    var res = await sample(askPrompt(q, curPlayer()), {
      modelTier:"quick",
      signal:ctrl.signal,
      onText:function(u){ if(askCtl===ctrl) paintAnswer(parseAnswer(u.text)); }
    });
    if(askCtl===ctrl){
      paintAnswer(parseAnswer(res.text));
      $("ansNote").textContent = t.liveBadge + (res.truncated ? " "+t.cut : "");
    }
  }catch(e){
    if(askCtl!==ctrl) return;
    var f = failCopy(e);
    if(f.hide){ sample = null; aiReady(); renderFallback(q); return; }
    var partial = e && e.text ? parseAnswer(e.text) : null;
    if(partial && partial.ex){ paintAnswer(partial); $("ansNote").textContent = f.msg; }
    else { $("ansEx").textContent = f.msg; $("ansNote").textContent = ""; }
  }finally{
    if(askCtl===ctrl){ askCtl = null; $("askStop").hidden = true; $("askBtn").disabled = false; }
  }
}

/* ---------- Events ---------- */
function selectMoment(id, scroll){
  state.mid = id;
  resetAI();
  markCurrent();
  renderPanel();
  if(scroll && window.matchMedia("(max-width: 860px)").matches){
    var calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    $("panel").scrollIntoView({ behavior: calm ? "auto" : "smooth", block:"start" });
  }
}

$("feed").addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest(".moment") : null;
  if(b) selectMoment(b.getAttribute("data-id"), true);
});
$("chips").addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest(".qc") : null;
  if(b){ $("askInput").value = b.textContent; ask(b.textContent); }
});
$("askForm").addEventListener("submit", function(e){ e.preventDefault(); ask($("askInput").value); });
$("liveBtn").addEventListener("click", runLive);
$("liveStop").addEventListener("click", function(){ if(liveCtl) liveCtl.abort(); });
$("askStop").addEventListener("click", function(){ if(askCtl) askCtl.abort(); });
$("capSel").addEventListener("change", function(){
  state.cap = $("capSel").value; store.set("wdjh.cap", state.cap);
  resetAI(); renderPanel();
});
var segBtns = document.querySelectorAll(".seg button");
for(var si=0; si<segBtns.length; si++){
  segBtns[si].addEventListener("click", function(){
    state.lang = this.getAttribute("data-lang"); store.set("wdjh.lang", state.lang);
    resetAI(); applyLang();
  });
}

/* ---------- Start ---------- */
applyLang();
(async function(){
  try{
    if(window.claude && typeof window.claude.use==="function"){ sample = await window.claude.use("sample"); }
  }catch(e){ sample = null; }
  if(!sample){
    try{
      var h = await fetch("/api/explain", { method:"GET" });
      if(h.ok) sample = serverAI;
    }catch(e){}
  }
  aiReady();
})();
})();
</script>
